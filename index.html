<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>TYPING QUEST - TAKII'S REVENGE</title>
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            border: 10px double #ff00ff;
            box-sizing: border-box;
        }

        /* 画面上部情報 */
        .info-panel {
            width: 90%;
            max-width: 700px;
            display: flex;
            justify-content: space-between;
            font-size: 1.2rem;
            margin-bottom: 20px;
            color: #0ff;
        }

        #timer-bar-outer {
            width: 100%;
            height: 10px;
            background: #333;
            margin-bottom: 20px;
        }
        #timer-bar-inner {
            height: 100%;
            background: #ff0;
            width: 100%;
            transition: width 0.1s linear;
        }

        /* 敵エリア */
        #enemy-area {
            text-align: center;
            height: 220px;
            margin-bottom: 20px;
        }
        #enemy-sprite {
            font-size: 8rem;
            display: inline-block;
            filter: drop-shadow(0 0 15px #f0f);
        }
        #enemy-hp {
            font-size: 1.5rem;
            color: #f00;
            font-weight: bold;
        }

        /* タイピングエリア */
        .window {
            border: 4px solid #fff;
            padding: 20px;
            background: #111;
            width: 90%;
            max-width: 600px;
            text-align: center;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        }

        .question-label { color: #aaa; font-size: 0.9rem; margin-bottom: 5px; }
        .japanese-word { font-size: 2rem; color: #fff; margin-bottom: 15px; text-shadow: 2px 2px #555; }
        
        #type-input {
            background: #000;
            color: #0f0;
            border: 2px solid #0f0;
            font-size: 2rem;
            width: 80%;
            text-align: center;
            padding: 10px;
            outline: none;
            text-transform: lowercase;
        }

        .enter-hint {
            margin-top: 10px;
            font-size: 0.8rem;
            color: #f0f;
            animation: blink 0.5s infinite;
        }

        @keyframes blink { 50% { opacity: 0; } }
        .shake { animation: shake 0.3s; }
        @keyframes shake {
            0%, 100% { transform: translate(0,0); }
            20% { transform: translate(-10px, 5px); }
            60% { transform: translate(10px, -5px); }
        }
    </style>
</head>
<body onclick="initAudio()">

        <div>LIFE: <span id="life-num" style="color:red">❤❤❤❤</span></div>
    </div>

    <div id="timer-bar-outer"><div id="timer-bar-inner"></div></div>

    <div id="enemy-area">
        <div id="enemy-name" style="font-size:1.2rem; color:#f0f;">TAKII'S SLIME</div>
        <div id="enemy-sprite">👾</div>
        <div id="enemy-hp">REMAIN: 5</div>
    </div>

    <div class="window" id="game-window">
        <div class="question-label">【英語に変換してタイピングせよ】</div>
        <div id="q-ja" class="japanese-word">読み込み中...</div>
        <input type="text" id="type-input" autocomplete="off" placeholder="TYPE HERE">
        <div class="enter-hint">Hit ENTER Key to Attack!</div>
    </div>

        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        function playSound(f, t, d) {
            if (!audioCtx) return;
            let o = audioCtx.createOscillator();
            let g = audioCtx.createGain();
            o.type = t; o.frequency.value = f;
            g.gain.setValueAtTime(0.1, audioCtx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + d);
            o.connect(g); g.connect(audioCtx.destination);
            o.start(); o.stop(audioCtx.currentTime + d);
        }

            document.getElementById('q-ja').innerText = currentWord.ja;
            document.getElementById('type-input').value = "";
            document.getElementById('type-input').focus();
            startTimer();
        }
