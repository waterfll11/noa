<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>TYPING QUEST - TAKII'S REVENGE</title>
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            border: 10px double #ff00ff;
            box-sizing: border-box;
        }

        .info-panel {
            width: 90%;
            max-width: 700px;
            display: flex;
            justify-content: space-between;
            font-size: 1.2rem;
            margin-bottom: 20px;
            color: #0ff;
        }

        #timer-bar-outer {
            width: 80%;
            max-width: 600px;
            height: 15px;
            background: #333;
            margin-bottom: 20px;
            border: 2px solid #fff;
        }
        #timer-bar-inner {
            height: 100%;
            background: #ff0;
            width: 100%;
        }

        #enemy-area {
            text-align: center;
            height: 220px;
            margin-bottom: 20px;
        }
        #enemy-sprite {
            font-size: 8rem;
            display: inline-block;
            filter: drop-shadow(0 0 15px #f0f);
        }
        #enemy-hp {
            font-size: 1.5rem;
            color: #f00;
            font-weight: bold;
        }

        .window {
            border: 4px solid #fff;
            padding: 20px;
            background: #111;
            width: 90%;
            max-width: 600px;
            text-align: center;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        }

        .japanese-word { font-size: 2.2rem; color: #0f0; margin-bottom: 5px; }
        .english-hint { font-size: 1.2rem; color: #aaa; margin-bottom: 15px; letter-spacing: 2px; }
        
        #type-input {
            background: #000;
            color: #fff;
            border: 3px solid #0ff;
            font-size: 2rem;
            width: 80%;
            text-align: center;
            padding: 10px;
            outline: none;
        }

        .enter-hint {
            margin-top: 15px;
            font-size: 1rem;
            color: #ff00ff;
            font-weight: bold;
        }

        .shake { animation: shake 0.3s; }
        @keyframes shake {
            0%, 100% { transform: translate(0,0); }
            20% { transform: translate(-10px, 5px); }
            60% { transform: translate(10px, -5px); }
        }
    </style>
</head>
