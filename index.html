<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>TAKII QUEST - BATTLE</title>
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            border: 10px double #555;
            box-sizing: border-box;
            transition: background 0.2s;
        }

        /* ゲージのデザイン */
        .ui-container {
            width: 80%;
            max-width: 600px;
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        .hp-bar-outer {
            width: 150px;
            height: 20px;
            border: 2px solid #fff;
            background: #222;
        }
        .hp-bar-inner {
            height: 100%;
            background: #0f0;
            width: 100%;
            transition: width 0.3s;
        }

        /* 敵の見た目 */
        #enemy-container {
            text-align: center;
            height: 200px;
        }
        #enemy-sprite {
            font-size: 6rem;
            margin-top: 20px;
            display: inline-block;
        }

        /* ウィンドウ */
        .window {
            border: 4px solid #fff;
            padding: 20px;
            background: #000;
            width: 80%;
            max-width: 600px;
            box-shadow: 0 0 0 4px #000, 0 0 0 8px #fff;
        }
        .message { height: 60px; font-size: 1.1rem; margin-bottom: 10px; }
        .commands { display: flex; gap: 10px; }
        .cmd-btn {
            background: #000; color: #fff; border: 2px solid #fff;
            padding: 10px; flex: 1; cursor: pointer; font-family: inherit;
        }
        .cmd-btn:hover { background: #fff; color: #000; }
        .cmd-btn:disabled { border-color: #444; color: #444; cursor: not-allowed; }

        /* アニメーション */
        .shake { animation: shake 0.3s; }
        @keyframes shake {
            0% { transform: translate(5px, 0); }
            50% { transform: translate(-5px, 0); }
            100% { transform: translate(0, 0); }
        }
    </style>
</head>
<body onclick="initAudio()">

    <div class="ui-container">
        <div>
            <div>PLAYER (takii好き)</div>
            <div class="hp-bar-outer"><div id="player-hp" class="hp-bar-inner"></div></div>
        </div>
        <div style="text-align: right;">
            <div id="enemy-name">TAKII 1号</div>
            <div class="hp-bar-outer"><div id="enemy-hp" class="hp-bar-inner"></div></div>
        </div>
    </div>
    
    <div id="enemy-container">
        <div id="enemy-sprite">👾</div>
    </div>

    <div class="window">
        <div id="text-box" class="message">takiiの化身たちが道を塞いでいる！<br>コマンドを入力せよ。</div>
