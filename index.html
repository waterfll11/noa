<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>チンアナゴ成長タップゲーム</title>
    <style>
        :root {
            /* 海の色と砂の色 */
            --ocean-blue: #0077be;
            --sand-color: #e6be8a;
            --eel-body: #ffffff; /* 白い体 */
            --eel-spot: #333333; /* 黒い斑点 */
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: flex-end; /* 下（砂地）を基準にする */
            align-items: center;
            height: 100vh;
            background: linear-gradient(to bottom, #005f99 0%, var(--ocean-blue) 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            user-select: none;
        }

        /* 右上のカウンター */
        #counter-display {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 1.5rem;
            font-weight: bold;
            color: white;
            background: rgba(0, 0, 0, 0.3);
            padding: 10px 25px;
            border-radius: 30px;
            border: 2px solid rgba(255, 255, 255, 0.5);
            z-index: 100;
        }

        /* 砂地 */
        .seabed {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 100px;
            background-color: var(--sand-color);
            z-index: 10;
            box-shadow: 0 -5px 15px rgba(0,0,0,0.2);
        }

        /* 泡のエフェクト（背景） */
        .bubble {
            position: absolute;
            bottom: -20px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            animation: rise 5s infinite ease-in;
        }

        @keyframes rise {
            to { transform: translateY(-100vh); opacity: 0; }
        }

        /* チンアナゴのコンテナ */
        #eel-container {
            position: relative;
            z-index: 5;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.05s;
        }

        #eel-container:active {
            transform: translateY(5px);
        }

        /* チンアナゴの体 */
        #eel-body {
            width: 40px;
            height: 100px; /* JSで可変 */
            background-color: var(--eel-body);
            border-radius: 20px 20px 0 0;
            position: relative;
            transition: height 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 2px solid #ddd;
        }

        /* 目 */
        .eye {
            position: absolute;
            top: 15px;
            width: 6px;
            height: 6px;
            background-color: #000;
            border-radius: 50%;
        }
        .eye.left { left: 8px; }
        .eye.right { right: 8px; }

        /* 口 */
        .mouth {
            position: absolute;
            top: 25px;
            left: 50%;
            width: 4px;
            height: 2px;
            background-color: #ff9999;
            transform: translateX(-50%);
        }

        /* 斑点（複数） */
        .spot {
            position: absolute;
            background-color: var(--eel-spot);
            border-radius: 50%;
            width: 8px;
