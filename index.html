<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>QUEST OF TAKII</title>
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            border: 10px double #fff;
            box-sizing: border-box;
        }

        /* RPGメッセージウィンドウ風 */
        .window {
            border: 4px solid #fff;
            padding: 20px;
            background: #000;
            width: 80%;
            max-width: 600px;
            box-shadow: 0 0 0 4px #000, 0 0 0 8px #fff;
            margin-bottom: 20px;
        }

        .status {
            font-size: 1.5rem;
            margin-bottom: 10px;
            color: #0f0;
        }

        .message {
            font-size: 1.2rem;
            line-height: 1.6;
            height: 80px;
        }

        .commands {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }

        .cmd-btn {
            background: #000;
            color: #fff;
            border: 2px solid #fff;
            padding: 10px 20px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.1s;
        }

        .cmd-btn:hover {
            background: #fff;
            color: #000;
        }

        /* 敵（takii）の見た目 */
        #enemy {
            font-size: 5rem;
            margin-bottom: 40px;
            transition: transform 0.2s;
            text-shadow: 0 0 20px #ff00ff;
        }

        .shake { animation: shake 0.3s linear; }
        @keyframes shake {
            0% { transform: translate(5px, 5px); }
            25% { transform: translate(-5px, -5px); }
            50% { transform: translate(5px, -5px); }
            75% { transform: translate(-5px, 5px); }
            100% { transform: translate(0, 0); }
        }
    </style>
</head>
<body onclick="initAudio()">

    <div class="status">LV.99 TAKII が現れた！</div>
    
    <div id="enemy">👾</div>

    <div class="window">
        <div id="text-box" class="message">コマンドを選択してください...</div>
        <div class="commands">
            <button class="cmd-btn" onclick="play('✊')">▶ ✊ グー</button>
            <button class="cmd-btn" onclick="play('✌️')">▶ ✌️ チョキ</button>
            <button class="cmd-btn" onclick="play('🖐️')">▶ 🖐️ パー</button>
        </div>
    </div>

    <script>
        const hands = ['✊', '✌️', '🖐️'];
        let audioCtx = null;

        // 音の生成関数（レトロなピコピコ音）
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        function playSound(freq, type, duration) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function play(playerHand) {
            initAudio();
            const botHand = hands[Math.floor(Math.random() * hands.length)];
            const textBox = document.getElementById('text-box');
            const enemy = document.getElementById('enemy');
            
            // 選択音
            playSound(440, 'square', 0.1);

            setTimeout(() => {
                if (playerHand === botHand) {
                    textBox.innerText = `たきいは ${botHand} を出した！\n引き分けだ。空間が歪む。`;
                    playSound(200, 'sine', 0.3);
                } else if (
                    (playerHand === '✊' && botHand === '✌️') ||
                    (playerHand === '✌️' && botHand === '🖐️') ||
                    (playerHand === '🖐️' && botHand === '✊')
                ) {
                    textBox.innerHTML = `<span style="color:#f0f">たきいにダメージを与えた！</span>\n勝利のメロディが響く。`;
                    enemy.classList.add('shake');
                    setTimeout(() => enemy.classList.remove('shake'), 300);
                    // 勝利音（アルペジオ）
                    playSound(523, 'square', 0.1);
                    setTimeout(() => playSound(659, 'square', 0.1), 100);
                    setTimeout(() => playSound(783, 'square', 0.3), 200);
                } else {
                    textBox.innerHTML = `<span style="color:#f00">たきいの攻撃！</span>\nあなたは致命的な個性を浴びた。`;
                    document.body.style.backgroundColor = '#400';
                    setTimeout(() => document.body.style.backgroundColor = '#000', 100);
                    // 敗北音
                    playSound(150, 'sawtooth', 0.5);
                }
            }, 300);
        }
    </script>
</body>
</html>
